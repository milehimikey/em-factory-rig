name: model-critic
version: "1.0"
description: Independent critic of the model and draft slice docs before the human sees them

defaults:
  runtime: codex

imports:
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [shared:review-team, shared:verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
