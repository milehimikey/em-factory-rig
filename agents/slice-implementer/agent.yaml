name: slice-implementer
version: "1.0"
description: Builds one ratified slice per worktree, test-first, surfacing gaps instead of guessing

defaults:
  runtime: claude-code

imports:
  - ref: path:/Users/mikey/.local/share/mise/installs/node/lts/lib/node_modules/@openrig/cli/daemon/specs/agents/shared

profiles:
  default:
    uses:
      skills: [shared:development-team, shared:test-driven-development, shared:systematic-debugging, shared:verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
