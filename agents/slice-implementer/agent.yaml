name: slice-implementer
version: "1.0"
description: Builds one ratified slice per worktree, test-first, surfacing gaps instead of guessing

defaults:
  runtime: claude-code

imports:
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [shared:development-team, shared:test-driven-development, shared:systematic-debugging, shared:verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
