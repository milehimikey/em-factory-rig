version: "0.2"
name: em-factory
summary: >
  Full-cycle event-modeling team for an em project: a modeling orchestrator and a delivery
  orchestrator with a live human between them as domain expert and sole ratifier. Discover →
  model → slice → review → implement → conform. Launch against the project repo:
  rig up rig.yaml --cwd <project>.
culture_file: CULTURE.md
permission_policy: policies/em-factory.policy.md
# The project tracks AGENTS.md (em's agent contract); keep Claude seats' managed blocks out of git.
managed_blocks:
  claude-code: CLAUDE.local.md

docs:
  - path: README.md

startup:
  files:
    - path: startup/boot.md
      delivery_hint: send_text
      required: true
  actions: []

services:
  kind: compose
  compose_file: axon.compose.yaml
  project_name: em-factory
  down_policy: leave_running
  wait_for:
    - url: http://127.0.0.1:8024/actuator/health
  surfaces:
    urls:
      - name: Axon Server dashboard
        url: http://127.0.0.1:8024
      - name: Live model view
        url: http://localhost:5173/?svg=toolshed.svg

pods:
  - id: model
    label: Modeling
    summary: Discover, model, slice docs, and review — runs ahead of delivery on the timeline.
    continuity_policy:
      enabled: true
      sync_triggers: [pre_compaction, pre_shutdown, milestone]
      artifacts:
        session_log: true
        restore_brief: true
      restore_protocol:
        peer_driven: true
        verify_via_quiz: false
    members:
      - id: lead
        label: Modeling lead (facilitator)
        agent_ref: "local:agents/modeling-lead"
        runtime: claude-code
        model: claude-opus-5-5
        profile: default
        cwd: "."
      - id: modeler
        label: Modeler (.em editor)
        agent_ref: "local:agents/em-modeler"
        runtime: claude-code
        model: claude-sonnet-5
        profile: default
        cwd: "."
      - id: slicer1
        label: Slice author 1
        agent_ref: "local:agents/slice-author"
        runtime: claude-code
        model: claude-opus-5-5
        profile: default
        cwd: "."
      - id: slicer2
        label: Slice author 2
        agent_ref: "local:agents/slice-author"
        runtime: claude-code
        model: claude-opus-5-5
        profile: default
        cwd: "."
      - id: critic
        label: Model critic
        agent_ref: "local:agents/model-critic"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - { kind: delegates_to, from: lead, to: modeler }
      - { kind: delegates_to, from: lead, to: slicer1 }
      - { kind: delegates_to, from: lead, to: slicer2 }
      - { kind: delegates_to, from: lead, to: critic }
      - { kind: can_observe, from: critic, to: modeler }
      - { kind: can_observe, from: critic, to: slicer1 }
      - { kind: can_observe, from: critic, to: slicer2 }
      - { kind: escalates_to, from: slicer1, to: lead }
      - { kind: escalates_to, from: slicer2, to: lead }

  - id: deliver
    label: Delivery
    summary: Gate ratified slices and carry each, in dependency order, to a PR the human merges.
    continuity_policy:
      enabled: true
      sync_triggers: [pre_compaction, pre_shutdown, milestone]
      artifacts:
        session_log: true
        restore_brief: true
      restore_protocol:
        peer_driven: true
        verify_via_quiz: false
    members:
      - id: lead
        label: Delivery lead (implementing-agent operator)
        agent_ref: "local:agents/delivery-lead"
        runtime: claude-code
        model: claude-opus-5-5
        profile: default
        cwd: "."
      - id: impl1
        label: Implementer 1
        agent_ref: "local:agents/slice-implementer"
        runtime: claude-code
        model: claude-sonnet-5
        profile: default
        cwd: "."
      - id: impl2
        label: Implementer 2
        agent_ref: "local:agents/slice-implementer"
        runtime: claude-code
        model: claude-sonnet-5
        profile: default
        cwd: "."
      - id: impl3
        label: Implementer 3
        agent_ref: "local:agents/slice-implementer"
        runtime: claude-code
        model: claude-sonnet-5
        profile: default
        cwd: "."
      - id: qa
        label: QA
        agent_ref: "local:agents/slice-qa"
        runtime: codex
        profile: default
        cwd: "."
      - id: reviewer
        label: PR reviewer
        agent_ref: "local:agents/pr-reviewer"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - { kind: delegates_to, from: lead, to: impl1 }
      - { kind: delegates_to, from: lead, to: impl2 }
      - { kind: delegates_to, from: lead, to: impl3 }
      - { kind: delegates_to, from: lead, to: qa }
      - { kind: delegates_to, from: lead, to: reviewer }
      - { kind: can_observe, from: qa, to: impl1 }
      - { kind: can_observe, from: qa, to: impl2 }
      - { kind: can_observe, from: qa, to: impl3 }
      - { kind: can_observe, from: reviewer, to: impl1 }
      - { kind: can_observe, from: reviewer, to: impl2 }
      - { kind: can_observe, from: reviewer, to: impl3 }
      - { kind: escalates_to, from: impl1, to: lead }
      - { kind: escalates_to, from: impl2, to: lead }
      - { kind: escalates_to, from: impl3, to: lead }

  - id: oversight
    label: Oversight
    summary: Advisory conformance on a cadence and the pilot's records; routes findings, never fixes.
    members:
      - id: steward
        label: Conform steward
        agent_ref: "local:agents/conform-steward"
        runtime: claude-code
        model: claude-sonnet-5
        profile: default
        cwd: "."
    edges: []

  - id: view
    label: Live view
    summary: Serves the live model diagram for the human.
    members:
      # Live diagram for the human. Names the project's model file — change it per project.
      - id: watch
        label: Live model view
        agent_ref: "builtin:terminal"
        runtime: terminal
        profile: none
        cwd: "."
        startup:
          files: []
          actions:
            - type: send_text
              value: "em watch toolshed.em -o toolshed.svg --serve"
              phase: after_ready
              idempotent: true
    edges: []

edges:
  - { kind: collaborates_with, from: model.lead, to: deliver.lead }
  - { kind: escalates_to, from: deliver.lead, to: model.lead }
  - { kind: can_observe, from: oversight.steward, to: model.lead }
  - { kind: can_observe, from: oversight.steward, to: deliver.lead }
